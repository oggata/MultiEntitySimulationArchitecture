<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>街マップエディター</title>
    <script src="../src/core/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .editor {
            display: flex;
            gap: 20px;
        }
        
        .palette {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 250px;
        }
        
        .palette h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .tile-button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 2px solid transparent;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        
        .tile-button:hover {
            background: #f0f0f0;
        }
        
        .tile-button.selected {
            border-color: #2196F3;
            background: #E3F2FD;
        }
        
        .tile-color {
            width: 24px;
            height: 24px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        .controls {
            margin-top: 20px;
        }
        
        .btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-export {
            background: #4CAF50;
            color: white;
        }
        
        .btn-export:hover {
            background: #45a049;
        }
        
        .btn-import {
            background: #2196F3;
            color: white;
        }
        
        .btn-import:hover {
            background: #1976D2;
        }
        
        .btn-clear {
            background: #f44336;
            color: white;
        }
        
        .btn-clear:hover {
            background: #d32f2f;
        }
        
        .canvas-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .canvas-info {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .zoom-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .zoom-btn {
            padding: 5px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }
        
        .zoom-btn:hover {
            background: #f0f0f0;
        }
        
        .zoom-level {
            min-width: 60px;
            text-align: center;
        }
        
        .canvas-wrapper {
            overflow: auto;
            max-width: 100%;
            max-height: 80vh;
            border: 1px solid #ccc;
        }
        
        canvas {
            cursor: crosshair;
            image-rendering: pixelated;
            display: block;
        }
        
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>街マップエディター</h1>
        
        <div class="editor">
            <div class="palette">
                <h2>配置タイル</h2>
                <div id="tileButtons"></div>
                <div style="margin-top:12px">
                    <label for="facilitySelect" style="display:block;margin-bottom:6px;color:#333;font-weight:bold">施設（locationData）</label>
                    <select id="facilitySelect" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;background:#fff"></select>
                </div>
                <div style="margin-top:12px">
                    <label for="directionSelect" style="display:block;margin-bottom:6px;color:#333;font-weight:bold">向き</label>
                    <select id="directionSelect" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;background:#fff">
                        <option value="up">上</option>
                        <option value="right">右</option>
                        <option value="down">下</option>
                        <option value="left">左</option>
                    </select>
                </div>
                
                <div class="controls">
                    <button class="btn btn-export" onclick="exportToJSON()">JSONで出力</button>
                    <button class="btn btn-import" onclick="document.getElementById('fileInput').click()">JSONを読み込み</button>
                    <input type="file" id="fileInput" accept=".json" onchange="importFromJSON(event)">
                    <button class="btn btn-clear" onclick="clearMap()">マップをクリア</button>
                    <button class="btn btn-export" onclick="saveForMesaAndOpen()">MESAで開く</button>
                </div>
            </div>
            
            <div class="canvas-container">
                <div id="canvasInfo" class="canvas-info">読み込み中...</div>
                <canvas id="mapCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 128;
        const CELL_SIZE = 12;
        
        const TILE_TYPES = {
            empty: { name: '空地', color: '#FFFFFF' },
            road: { name: '道路', color: '#808080' },
            residential: { name: '住宅地', color: '#FFE4B5' },
    };
        
        let selectedTile = 'road';
        let isDrawing = false;
        let gridData = [];
        let selectedDirection = 'up';
        
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const canvasInfoEl = document.getElementById('canvasInfo');

        // キャンバスサイズと情報表示の更新
        function updateCanvasSize() {
            const pixelSize = GRID_SIZE * CELL_SIZE;
            canvas.width = pixelSize;
            canvas.height = pixelSize;
            if (canvasInfoEl) {
                canvasInfoEl.textContent = `${GRID_SIZE} × ${GRID_SIZE} グリッド（クリック＆ドラッグで配置）`;
            }
        }
        
        // グリッドデータの初期化
        function initGrid() {
            gridData = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                gridData[i] = [];
                for (let j = 0; j < GRID_SIZE; j++) {
                    gridData[i][j] = 'empty';
                }
            }
        }
        
        // タイルボタンの生成
        function createTileButtons() {
            const container = document.getElementById('tileButtons');
            for (const [key, value] of Object.entries(TILE_TYPES)) {
                const button = document.createElement('button');
                button.className = 'tile-button';
                if (key === selectedTile) button.classList.add('selected');
                button.onclick = () => selectTile(key);
                
                const colorDiv = document.createElement('div');
                colorDiv.className = 'tile-color';
                colorDiv.style.backgroundColor = value.color;
                
                const span = document.createElement('span');
                span.textContent = value.name;
                
                button.appendChild(colorDiv);
                button.appendChild(span);
                container.appendChild(button);
            }

            // locationData 由来の施設ドロップダウン
            const select = document.getElementById('facilitySelect');
            // 先頭にプレースホルダー
            const ph = document.createElement('option');
            ph.value = '';
            ph.textContent = '選択してください';
            select.appendChild(ph);

            // locationData が読み込まれていれば、それを列挙
            if (Array.isArray(locationData)) {
                locationData.forEach((loc) => {
                    const opt = document.createElement('option');
                    opt.value = `facility:${loc.name}`;
                    opt.textContent = loc.name;
                    select.appendChild(opt);

                    // 描画用に動的タイルタイプを用意（16進カラーをCSSに変換）
                    const hex = (loc.color >>> 0).toString(16).padStart(6, '0');
                    const cssColor = `#${hex}`;
                    const key = `facility:${loc.name}`;
                    if (!TILE_TYPES[key]) {
                        TILE_TYPES[key] = { name: loc.name, color: cssColor };
                    }
                });
            }

            select.addEventListener('change', (e) => {
                const val = e.target.value;
                if (val) {
                    selectTile(val);
                }
            });

            // 向き選択
            const dirSelect = document.getElementById('directionSelect');
            dirSelect.addEventListener('change', (e) => {
                selectedDirection = e.target.value;
            });
        }
        
        // タイル選択
        function selectTile(tileKey) {
            selectedTile = tileKey;
            const buttons = document.querySelectorAll('.tile-button');
            buttons.forEach((btn, index) => {
                const key = Object.keys(TILE_TYPES)[index];
                if (key === tileKey) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
            // ドロップダウンも同期
            const select = document.getElementById('facilitySelect');
            if (select && select.value !== tileKey && tileKey.startsWith('facility:')) {
                select.value = tileKey;
            }
        }
        
        // キャンバスの描画
        function drawCanvas() {
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    const raw = gridData[i][j];
                    const baseKey = typeof raw === 'string' ? raw.split('|')[0] : 'empty';
                    const t = TILE_TYPES[baseKey] || { color: '#FFFFFF' };
                    ctx.fillStyle = t.color;
                    ctx.fillRect(j * CELL_SIZE, i * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                    // 向き矢印の描画（方向指定がある場合）
                    if (typeof raw === 'string' && raw.includes('|dir:')) {
                        const dir = (raw.match(/\|dir:([^|]+)/) || [null, 'up'])[1];
                        const cx = j * CELL_SIZE + CELL_SIZE / 2;
                        const cy = i * CELL_SIZE + CELL_SIZE / 2;
                        const size = Math.max(4, Math.floor(CELL_SIZE * 0.3));
                        ctx.fillStyle = '#333333';
                        ctx.beginPath();
                        if (dir === 'up') {
                            ctx.moveTo(cx, cy - size);
                            ctx.lineTo(cx - size * 0.6, cy + size * 0.6);
                            ctx.lineTo(cx + size * 0.6, cy + size * 0.6);
                        } else if (dir === 'right') {
                            ctx.moveTo(cx + size, cy);
                            ctx.lineTo(cx - size * 0.6, cy - size * 0.6);
                            ctx.lineTo(cx - size * 0.6, cy + size * 0.6);
                        } else if (dir === 'down') {
                            ctx.moveTo(cx, cy + size);
                            ctx.lineTo(cx - size * 0.6, cy - size * 0.6);
                            ctx.lineTo(cx + size * 0.6, cy - size * 0.6);
                        } else if (dir === 'left') {
                            ctx.moveTo(cx - size, cy);
                            ctx.lineTo(cx + size * 0.6, cy - size * 0.6);
                            ctx.lineTo(cx + size * 0.6, cy + size * 0.6);
                        }
                        ctx.closePath();
                        ctx.fill();
                    }
                }
            }
        }
        
        // タイルの配置
        function placeTile(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            const y = Math.floor((e.clientY - rect.top) / CELL_SIZE);
            
            if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
                // 基本キーと向きをエンコード
                const baseKey = selectedTile;
                const needsDir = baseKey !== 'empty' && baseKey !== 'road' && baseKey !== 'railway';
                const encoded = needsDir ? `${baseKey}|dir:${selectedDirection}` : baseKey;
                gridData[y][x] = encoded;
                const t = TILE_TYPES[baseKey] || { color: '#FFFFFF' };
                ctx.fillStyle = t.color;
                ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // 矢印を即時描画
                if (needsDir) {
                    const cx = x * CELL_SIZE + CELL_SIZE / 2;
                    const cy = y * CELL_SIZE + CELL_SIZE / 2;
                    const size = Math.max(4, Math.floor(CELL_SIZE * 0.3));
                    ctx.fillStyle = '#333333';
                    ctx.beginPath();
                    if (selectedDirection === 'up') {
                        ctx.moveTo(cx, cy - size);
                        ctx.lineTo(cx - size * 0.6, cy + size * 0.6);
                        ctx.lineTo(cx + size * 0.6, cy + size * 0.6);
                    } else if (selectedDirection === 'right') {
                        ctx.moveTo(cx + size, cy);
                        ctx.lineTo(cx - size * 0.6, cy - size * 0.6);
                        ctx.lineTo(cx - size * 0.6, cy + size * 0.6);
                    } else if (selectedDirection === 'down') {
                        ctx.moveTo(cx, cy + size);
                        ctx.lineTo(cx - size * 0.6, cy - size * 0.6);
                        ctx.lineTo(cx + size * 0.6, cy - size * 0.6);
                    } else if (selectedDirection === 'left') {
                        ctx.moveTo(cx - size, cy);
                        ctx.lineTo(cx + size * 0.6, cy - size * 0.6);
                        ctx.lineTo(cx + size * 0.6, cy + size * 0.6);
                    }
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }
        
        // マウスイベント
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            placeTile(e);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) {
                placeTile(e);
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });
        
        // JSON出力
        function exportToJSON() {
            const json = JSON.stringify(gridData);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'city_map.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // JSON読み込み
        function importFromJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const json = JSON.parse(event.target.result);
                    
                    if (!Array.isArray(json) || json.length !== GRID_SIZE) {
                        alert(`無効なJSONデータです。${GRID_SIZE}x${GRID_SIZE}のグリッドデータが必要です。`);
                        return;
                    }
                    
                    for (let i = 0; i < json.length; i++) {
                        if (!Array.isArray(json[i]) || json[i].length !== GRID_SIZE) {
                            alert(`無効なJSONデータです。${GRID_SIZE}x${GRID_SIZE}のグリッドデータが必要です。`);
                            return;
                        }
                    }
                    
                    gridData = json;
                    drawCanvas();
                    alert('マップを読み込みました！');
                } catch (error) {
                    alert('JSONファイルの読み込みに失敗しました。');
                    console.error(error);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // MESA用にローカルストレージへ保存して本体を開く
        function saveForMesaAndOpen() {
            try {
                // RLE圧縮（連続する同一タイルをまとめる）
                const segments = [];
                for (let y = 0; y < GRID_SIZE; y++) {
                    let currentTile = gridData[y][0];
                    let count = 1;
                    for (let x = 1; x < GRID_SIZE; x++) {
                        const tile = gridData[y][x];
                        if (tile === currentTile) {
                            count++;
                        } else {
                            segments.push({ tile: currentTile, count });
                            currentTile = tile;
                            count = 1;
                        }
                    }
                    segments.push({ tile: currentTile, count });
                }

                const serialized = JSON.stringify(segments);
                const chunkSize = 500000; // 500KB相当（文字数ベース）
                const chunkCount = Math.ceil(serialized.length / chunkSize);

                for (let i = 0; i < chunkCount; i++) {
                    const chunk = serialized.slice(i * chunkSize, (i + 1) * chunkSize);
                    localStorage.setItem(`mesa_editor_map_chunk_${i}`, chunk);
                }
                localStorage.setItem('mesa_editor_map_chunks', String(chunkCount));
                localStorage.setItem('mesa_editor_map_info', JSON.stringify({
                    compressed: true,
                    gridSize: GRID_SIZE,
                    timestamp: Date.now()
                }));

                alert('MESA本体で地図を読み込めるように保存しました。MESAを開きます。');
                // ルートのindex.htmlへ遷移
                window.location.href = '../index.html';
            } catch (err) {
                console.error(err);
                alert('MESA用データの保存に失敗しました。');
            }
        }
        
        // マップをクリア
        function clearMap() {
            if (confirm('マップをクリアしますか？')) {
                initGrid();
                drawCanvas();
            }
        }
        
        // 初期化
        initGrid();
        createTileButtons();
        updateCanvasSize();
        drawCanvas();
    </script>
</body>
</html>
